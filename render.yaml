services:
  # ── FastAPI Backend Service ────────────────────────────────────
  - type: web
    name: aicte-dashboard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./aicte.db
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

  # ── React + Vite Frontend Static Site ──────────────────────────
  - type: web
    name: aicte-dashboard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aicte-dashboard-api
          property: host
      - key: VITE_USE_MOCKS
        value: "false"

