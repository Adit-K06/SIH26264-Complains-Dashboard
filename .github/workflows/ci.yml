name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: pytest ─────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicte
          POSTGRES_PASSWORD: aicte
          POSTGRES_DB: aicte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://aicte:aicte@localhost:5432/aicte_test
      SECRET_KEY: ci-test-secret-key-32-characters!!
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pg_trgm
        run: |
          PGPASSWORD=aicte psql -h localhost -U aicte -d aicte_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run pytest
        run: |
          cd backend
          python -m pytest --tb=short -v --cov=app --cov-report=term-missing

  # ── Frontend: npm build ──────────────────────────────────────
  frontend-build:
    name: Frontend Build (npm)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type-check + Build
        run: |
          cd frontend
          npm run build

  # ── Docker Compose smoke test ────────────────────────────────
  compose-health:
    name: Docker Compose Health Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build
        env:
          SECRET_KEY: ci-test-secret-key-32-characters!!

      - name: Wait for api health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo "API is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Wait for web health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health; then
              echo "Web proxy is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Print compose logs on failure
        if: failure()
        run: docker compose logs
