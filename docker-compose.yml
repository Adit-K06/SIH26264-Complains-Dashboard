version: "3.9"

# ─────────────────────────────────────────────────────────────
#  AICTE Complaint Coordination Dashboard — SIH26264
#  Docker Compose: db + api + worker + web (one URL)
#  Demo uses synthetic data. SLA values are placeholders,
#  not official AICTE norms.
# ─────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg2://aicte:aicte@db:5432/aicte
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-32char}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: aicte
      POSTGRES_DB: aicte
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte -d aicte"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - attachments_data:/app/attachments

  # ── APScheduler worker ─────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── React frontend (nginx) ─────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  attachments_data:
