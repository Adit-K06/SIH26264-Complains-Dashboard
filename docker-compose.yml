services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - uploads:/data/uploads
      - ./backend:/app
      - ./data:/app/data
      - ./docs:/app/docs
    ports:
      - "8000:8000"
    environment:
      - OVERLAP_THRESHOLD=${OVERLAP_THRESHOLD:-0.40}
      - SIMILARITY_MODE=${SIMILARITY_MODE:-tfidf}

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.worker.main
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - OVERLAP_THRESHOLD=${OVERLAP_THRESHOLD:-0.40}
      - SIMILARITY_MODE=${SIMILARITY_MODE:-tfidf}

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
