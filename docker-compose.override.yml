# docker-compose.override.yml — local development overrides
# Automatically picked up by `docker compose up`
# Do NOT commit secrets here. Use .env for secrets.
version: "3.9"

services:
  # Mount source for hot-reload in dev (api)
  api:
    volumes:
      - ./backend/app:/app/app
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG

  # Mount source for hot-reload in dev (worker)
  worker:
    volumes:
      - ./backend/app:/app/app
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG

  # Expose db port for local tools (DBeaver, pgAdmin)
  db:
    ports:
      - "5432:5432"
